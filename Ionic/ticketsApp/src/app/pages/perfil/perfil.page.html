<ion-header [translucent]="true">
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-container">

  <!-- Cargando usuario -->
  <div *ngIf="!usuario" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando datos...</p>
  </div>

  <!-- Perfil -->
  <div *ngIf="usuario" class="perfil-card">
    
    <div class="avatar-container">
      <ion-avatar class="perfil-avatar">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" />
      </ion-avatar>
      <h2>{{ usuario.nombre || 'Usuario' }}</h2>
      <p class="rol">{{ usuario.rol || 'Empleado' }}</p>
    </div>

    <!-- CARD DE INFORMACIÓN Y EDICIÓN -->
    <ion-card class="info-card">
      <ion-card-content>

        <!-- Nombre -->
        <ion-item>
          <ion-icon name="person-outline" slot="start" color="danger"></ion-icon>
          <ion-label position="floating"><strong>Nombre</strong></ion-label>
          <ion-input [(ngModel)]="usuario.nombre"></ion-input>
        </ion-item>

        <!-- Correo -->
        <ion-item>
          <ion-icon name="mail-outline" slot="start" color="danger"></ion-icon>
          <ion-label position="floating"><strong>Correo</strong></ion-label>
          <ion-input [(ngModel)]="usuario.correo"></ion-input>
        </ion-item>

        <!-- Usuario -->
        <ion-item>
          <ion-icon name="business-outline" slot="start" color="danger"></ion-icon>
          <ion-label position="floating"><strong>Usuario</strong></ion-label>
          <ion-input [(ngModel)]="usuario.usuario"></ion-input>
        </ion-item>

        <br>

        <!-- SECCIÓN CAMBIO DE CONTRASEÑA -->
        <h3 class="ion-text-center">Cambiar Contraseña</h3>

        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start" color="danger"></ion-icon>
          <ion-label position="floating">Contraseña actual</ion-label>
          <ion-input type="password" [(ngModel)]="contrasenaActual"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="key-outline" slot="start" color="danger"></ion-icon>
          <ion-label position="floating">Nueva contraseña</ion-label>
          <ion-input type="password" [(ngModel)]="nuevaContrasena"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="key-outline" slot="start" color="danger"></ion-icon>
          <ion-label position="floating">Confirmar contraseña</ion-label>
          <ion-input type="password" [(ngModel)]="confirmarContrasena"></ion-input>
        </ion-item>

        <ion-button expand="block" color="primary" class="ion-margin-top" (click)="guardarCambios()">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          Guardar Cambios
        </ion-button>

      </ion-card-content>
    </ion-card>

    <ion-button expand="block" color="medium" (click)="cerrarSesion()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>

  </div>

</ion-content>
